services:
  - type: web
    name: salmiya-nahna-maek-new
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:APP --workers 1 --threads 4 --timeout 120
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_BOT_POLLING
        value: "true"
